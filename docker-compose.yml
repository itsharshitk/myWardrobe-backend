services:
  app:
    build: .
    container_name: wardrobe-app

    ports:
      - "3000:3000"

    env_file:
      - .env

    volumes:
      - .:/app
      - /app/node_modules

    depends_on:
      - mongo

    restart: unless-stopped

  mongo:
    image: mongo:8

    container_name: wardrobe-mongo

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

    restart: unless-stopped

volumes:
  mongo_data: